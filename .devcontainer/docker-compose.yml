version: "3.9"

services:
  isaac-sim:
    image: nvcr.io/nvidia/isaac-sim:4.2.0
    container_name: isaac_ros2_container
    runtime: nvidia
    environment:
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - DISPLAY=${DISPLAY}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      # X11 socket for GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Isaac Sim user data (persists settings, cache, logs)
      - isaac_user_data:/home/developer/.nvidia-omniverse
      # Host ROS 2 workspace
      - ~/ros2_ws:/workspace/ros2_ws:rw
    network_mode: host
    stdin_open: true
    tty: true
    command: >
      bash -c "
        id -u developer &>/dev/null || useradd -m -s /bin/bash developer &&
        chown -R developer:developer /workspace /home/developer &&
        sudo -u developer bash
      "

volumes:
  isaac_user_data:
